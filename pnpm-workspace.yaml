packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
  - "tooling/*"
  - "tests/*"

allowBuilds:
  "@serialport/bindings-cpp": true
  "@vscode/vsce-sign": true
  electron: true
  electron-winstaller: true
  esbuild: true
  keytar: false

# electron-builder 26.15.3 依赖声明为 @electron/get ^3.0.0，但其 resolveCacheMode 使用了
# @electron/get 5.x 才导出的 ElectronDownloadCacheMode（3.x 缺该导出 → 打包时
# "Cannot read properties of undefined (reading 'ReadWrite')"）。此处强制提升到 5.1.0。
overrides:
  "@electron/get": 5.1.0

catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  antd: ^6.6.0
  "@ant-design/icons": ^6.3.2
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/modifiers": ^9.0.0
  "@dnd-kit/utilities": ^3.2.2
  zustand: ^5.0.14
  i18next: ^26.3.6
  react-i18next: ^17.0.11
  idb: ^8.0.3
  zod: ^4.4.3
  react-hook-form: ^7.85.0
  "@hookform/resolvers": ^5.7.1
  typescript: ~6.0.2
  vitest: ^4.1.10
  "@playwright/test": ^1.62.1
  vite: ^8.2.0
  "@vitejs/plugin-react": ^6.0.4
  vite-plugin-electron: ^1.1.1

patchedDependencies:
  vscode-test-playwright@0.0.1-beta2: patches/vscode-test-playwright@0.0.1-beta2.patch
